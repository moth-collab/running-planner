# Netlify configuration for running-planner
# Static single-page site (index.html at repo root) — no build step.

[build]
  # Serve the repository root as-is; nothing to compile.
  publish = "."
  command = ""

# Serve the web app manifest with the correct MIME type so the PWA installs reliably.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Always revalidate the service worker so updates roll out immediately.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
